[workspace]
resolver = "2"
members = ["crates/timefs-core", "crates/timefs-fuse", "crates/timefs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/SumitKumar-17/timefs"
authors = ["Sumit Kumar"]

[workspace.dependencies]
blake3 = "1.8"
fastcdc = "3"
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
fuser = { version = "0.18", features = ["libfuse3"] }
tempfile = "3"
signal-hook = "0.3"
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
